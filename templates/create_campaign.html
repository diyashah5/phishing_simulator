<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Campaign</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      display: flex;
    }

    .sidebar {
      width: 220px;
      background: #2c3e50;
      color: white;
      height: 100vh;
      padding: 20px 0;
    }

    .sidebar h2 {
      text-align: center;
      font-size: 20px;
      color: #ecf0f1;
      margin-bottom: 30px;
    }

    .sidebar a {
      display: block;
      color: white;
      padding: 12px 20px;
      text-decoration: none;
    }

    .sidebar a:hover {
      background: #34495e;
    }

    .main-content {
      flex: 1;
      padding: 30px;
    }

    .main-content h2 {
      margin-top: 0;
      padding:25px;
    }

    form {
      background-color: #fff;
      padding: 100px;
      border-radius: 10px;
      box-shadow: 0 0 10px #ccc;
      max-width: 700px;
    }

    label {
      font-weight: bold;
      margin-top: 15px;
      display: block;
    }

    textarea, input[type="text"] {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }

    button {
      padding: 12px 24px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 20px;
    }

    button:hover {
      background-color: #0056b3;
    }

    .back-link {
      margin-top: 20px;
      display: inline-block;
      color: #007bff;
      text-decoration: none;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <h2>📊 PhishAware</h2>
    <a href="/admin/dashboard">Dashboard</a>
    <a href="/admin/create-campaign">Create Campaign</a>
    <a href="#">Users</a>
    <a href="#">Groups</a>
    <a href="#">Reports</a>
    <a href="#">Settings</a>
  </div>

  <div class="main-content">
    <h2>📩 Create New Campaign</h2>
      <!-- Place this just inside the card div -->
{% if success %}
  <div style="padding: 10px; margin-bottom: 20px; background-color: #d4edda; border: 1px solid #c3e6cb; color: #155724; border-radius: 5px;">
    ✅ Campaign launched successfully!
  </div>
{% endif %}

    <form method="POST">
      <label for="name">Campaign Name</label>
      <input type="text" id="name" name="name" placeholder="e.g., HR Policy Update" required>

      <label for="message">Email Message (optional)</label>
      <textarea id="message" name="message" rows="4" placeholder="e.g., Please review the updated policy document."></textarea>

      <label for="landing_page">Landing Page URL</label>
      <input type="text" id="landing_page" name="landing_page" value="/fake-login" required>

      <label for="group_name">Group Name</label>
      <input type="text" id="group_name" name="group_name" placeholder="e.g., HR Team" required>

      <label for="targets">Target Emails (comma-separated)</label>
      <textarea id="targets" name="targets" rows="3" placeholder="e.g., alice@example.com, bob@example.com" required></textarea>

      <button type="submit">🚀 Launch Campaign</button>
    </form>

    <a class="back-link" href="/admin/dashboard">← Back to Dashboard</a>
  </div>



</body>
</html>
